%YAML 1.2
---
$id: http://devicetree.org/schemas/ufs/mediatek,ufs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Mediatek Universal Flash Storage (UFS) Controller

maintainers:
  - Peter Wang <peter.wang@mediatek.com>
  - Chaotian Jing <chaotian.jing@mediatek.com>

properties:
  compatible:
    oneOf:
      - const: mediatek,mt8183-ufshci
      - const: mediatek,mt8195-ufshci
      - items:
          - enum:
              - mediatek,mt8192-ufshci
          - const: mediatek,mt8183-ufshci

  clocks:
    minItems: 1
    maxItems: 8

  clock-names:
    minItems: 1
    maxItems: 8

  phys:
    maxItems: 1

  reg:
    maxItems: 1

  vcc-supply: true

  mediatek,ufs-disable-mcq:
    $ref: /schemas/types.yaml#/definitions/flag
    description: The mask to disable MCQ (Multi-Circular Queue) for UFS host.

  mediatek,ufs-boost-crypt:
    description: Enable boost for crypto engine.
    type: boolean

  mediatek,ufs-support-va09:
    description: Enable VA09 power control support.
    type: boolean

  mediatek,ufs-disable-ah8:
    description: Disable auto-hibernation (AH8).
    type: boolean

  mediatek,ufs-broken-vcc:
    description: Indicates that VCC is broken and needs a workaround.
    type: boolean

  mediatek,ufs-pmc-via-fastauto:
    description: Enable power mode change via FASTAUTO mode.
    type: boolean

  mediatek,ufs-tx-skew-fix:
    description: Enable fix for TX skew issue.
    type: boolean

  mediatek,ufs-rtff-mtcmos:
    description: Enable RTFF MTCMOS power control.
    type: boolean

required:
  - compatible
  - clocks
  - clock-names
  - phys
  - reg
  - vcc-supply

unevaluatedProperties: false

allOf:
  - $ref: ufs-common.yaml

  - if:
      properties:
        compatible:
          contains:
            enum:
              - mediatek,mt8195-ufshci
    then:
      properties:
        clocks:
          minItems: 8
        clock-names:
          items:
            - const: ufs
            - const: ufs_aes
            - const: ufs_tick
            - const: unipro_sysclk
            - const: unipro_tick
            - const: unipro_mp_bclk
            - const: ufs_tx_symbol
            - const: ufs_mem_sub
    else:
      properties:
        clocks:
          maxItems: 1
        clock-names:
          items:
            - const: ufs

examples:
  - |
    #include <dt-bindings/clock/mt8183-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        ufs@ff3c0000 {
            compatible = "mediatek,mt8183-ufshci";
            reg = <0 0x11270000 0 0x2300>;
            interrupts = <GIC_SPI 104 IRQ_TYPE_LEVEL_LOW>;
            phys = <&ufsphy>;

            clocks = <&infracfg_ao CLK_INFRA_UFS>;
            clock-names = "ufs";
            freq-table-hz = <0 0>;

            vcc-supply = <&mt_pmic_vemc_ldo_reg>;
        };
    };
